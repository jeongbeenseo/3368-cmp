<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Board</title>

<!-- Makes it behave like an installed app once it's on a real https:// address -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="House Board">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f6f2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=JSON.parse(localStorage.getItem("hb:theme"));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>

<style>
  :root{
    --ink:#191b29; --slate:#666c82; --faint:#9aa0b3;
    --line:#d5d9e4; --bg:#e9ebf1; --card:#fff;
    --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --c0:#0f7c8a; --c1:#b0601d; --c2:#5b4bb7; --c3:#a83a5c; --c4:#2f7d4f; --c5:#2a5fa8; --c6:#8a6d1f; --c7:#37727e;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px 18px 80px;background:var(--bg);color:var(--ink);
       font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto}

  /* header + identity */
  .top{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0}
  .sub{color:var(--slate);font-size:14px;margin:2px 0 0}
  .ident{display:flex;align-items:center;gap:8px}

  nav.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px}
  nav.tabs button{
    font:inherit;font-family:var(--display);font-weight:600;font-size:15px;color:var(--slate);
    background:none;border:0;border-bottom:3px solid transparent;padding:9px 13px;margin-bottom:-1px;cursor:pointer;border-radius:6px 6px 0 0}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}

  h2.sec{font-family:var(--display);font-weight:700;font-size:19px;margin:0 0 3px}
  .lede{color:var(--slate);font-size:14px;margin:0 0 16px}
  h3.sub-h{font-family:var(--display);font-weight:700;font-size:15px;margin:30px 0 10px}

  /* controls */
  button.btn{font:inherit;font-size:14px;font-weight:600;padding:7px 13px;border-radius:9px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button.btn:hover{border-color:var(--faint)}
  button.btn.solid{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
  button.btn.ghost{border-color:transparent;background:transparent;color:var(--slate);padding:6px 8px}
  button.btn.ghost:hover{color:var(--ink)}
  button.btn.tiny{font-size:12.5px;padding:4px 9px}
  input,select,textarea{font:inherit;font-size:15px;padding:8px 11px;border:1px solid var(--line);
    border-radius:9px;background:var(--card);color:var(--ink);min-width:0;max-width:100%}
  textarea{resize:vertical;line-height:1.45}
  label.stack{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--slate)}
  .row{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end}
  :focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}

  .banner{background:#fff5d8;border:1px solid #e6cf8a;border-radius:11px;padding:11px 14px;font-size:14.5px;margin-bottom:18px}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--slate);font-size:14.5px}

  /* people chips */
  .chip{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:15px}
  .badge{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;color:#fff;
    font-family:var(--display);font-size:12px;font-weight:700;flex:none}
  .badge.sm{width:21px;height:21px;font-size:10px}

  /* cleaning zones */
  .zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
  .zone{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px 20px;overflow:hidden}
  .zone::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--accent)}
  .zone.done{background:var(--tint)}
  .zone h3{font-family:var(--display);font-weight:700;font-size:19px;color:var(--accent);margin:0 0 2px;letter-spacing:-.01em}
  .zone .tasks{color:var(--slate);font-size:13px;margin:0 0 12px}
  .zone .people{display:flex;flex-wrap:wrap;gap:7px 16px;margin-bottom:14px}
  .zone .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .tick{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:600;color:var(--slate);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px;cursor:pointer}
  .tick .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;
    color:#fff;font-size:11px;transition:background .15s}
  .zone.done .tick{color:var(--accent);border-color:var(--accent)}
  .zone.done .tick .box{background:var(--accent);border-color:var(--accent)}
  .cyclebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
  .pill{font-family:var(--display);font-weight:700;font-size:14px;background:var(--ink);color:var(--on-ink);padding:5px 12px;border-radius:999px}

  /* booking */
  .restabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .restabs button{font:inherit;font-size:14px;font-weight:600;padding:6px 13px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--slate);cursor:pointer}
  .restabs button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
  .days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
  .days button{font:inherit;flex:none;width:60px;padding:7px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--slate);cursor:pointer;text-align:center;line-height:1.25}
  .days button b{display:block;font-family:var(--display);font-size:16px;color:var(--ink)}
  .days button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--faint)}
  .days button[aria-current="true"] b{color:#fff}
  .slots{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .slot{display:flex;align-items:center;gap:12px;padding:7px 13px;border-top:1px solid var(--line)}
  .slot:first-child{border-top:0}
  .slot .hr{width:52px;color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
  .slot .who{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
  .slot.taken{background:var(--tint)}
  .slot.mine{background:#eef1fb}

  /* trips */
  .trip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px}
  .trip .head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
  .trip .store{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
  .trip .when{color:var(--slate);font-size:14px}
  .going{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}
  .list{margin:12px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
  .list li{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
  .list li.got{color:var(--faint);text-decoration:line-through}
  .list input[type=checkbox]{width:17px;height:17px;accent-color:var(--ink);flex:none}
  .list .by{color:var(--faint);font-size:12px;margin-left:auto;text-decoration:none}

  /* noticeboard */
  .post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px}
  .post.resolved{opacity:.62}
  .post .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--slate)}
  .tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;color:#fff}
  .post .text{margin:0;white-space:pre-wrap}
  .replies{margin:12px 0 0;padding:11px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
  .reply{font-size:14.5px}
  .reply .rmeta{color:var(--faint);font-size:12.5px}
  .filters{display:flex;gap:6px;margin:20px 0 12px}
  .filters button{font:inherit;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--slate);cursor:pointer}
  .filters button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

  /* housemates */
  .plist{display:flex;flex-direction:column;gap:8px;max-width:430px}
  .prow{display:flex;align-items:center;gap:10px}
  .prow input{flex:1}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--on-ink);font-size:14px;padding:9px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:560px){
    h1{font-size:25px}
    .top{align-items:flex-start}
    .slot .hr{width:46px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
  .role{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--on-ink)}
  .role.member{background:transparent;color:var(--slate);border:1px solid var(--line)}
  .locked{color:var(--faint);font-size:13px;margin:14px 0 0;max-width:58ch}
  .loading{color:var(--slate);text-align:center;padding:16vh 0;font-size:15px}

  .pick{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
  .pick button{font:inherit;font-size:13.5px;font-weight:600;padding:5px 11px;border-radius:999px;
               border:1px solid var(--line);background:var(--card);color:var(--slate);cursor:pointer}
  .pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .byhand{font-size:12px;color:var(--faint);margin:0 0 10px}

  .unitname{color:var(--faint);font-weight:500;font-size:13px;margin-left:5px}

  .pending{background:#fff5d8;border:1px solid #e6cf8a;border-radius:13px;padding:14px 16px;margin-bottom:11px}
  .pending .who{font-family:var(--display);font-weight:700;font-size:17px}

  .members{width:100%;border-collapse:collapse;font-size:14.5px}
  .members th{text-align:left;font-size:12.5px;color:var(--slate);font-weight:600;padding:7px 8px}
  .members td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
  .members input,.members select{font-size:14px;padding:6px 9px}
  .members code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f1f3f8;
                padding:3px 9px;border-radius:6px;letter-spacing:.12em}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .confirming{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .results{background:var(--card);border:1px solid var(--line);border-radius:13px;
           padding:13px 16px;margin:0 0 18px;max-width:640px}
  .hitlist{list-style:none;margin:0;padding:0}
  .hitlist li{display:flex;align-items:baseline;gap:10px;padding:7px 0;
              border-top:1px solid var(--line);font-size:14.5px}
  .hitlist li:first-child{border-top:0}
  .hitlist em{width:9px;height:9px;border-radius:50%;flex:none;display:block;
              position:relative;top:2px}
  .hitlist .when{color:var(--slate);font-size:13px;width:196px;flex:none;
                 font-variant-numeric:tabular-nums}
  @media (max-width:560px){
    .hitlist li{flex-wrap:wrap}
    .hitlist .when{width:auto}
  }
  .status{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
  .status.active{background:#e6f2ea;color:var(--c4)}
  .status.blocked{background:#fbe9ee;color:var(--c3)}

  /* --- Calendar tab ------------------------------------------------ */
  .calhead{display:flex;align-items:center;gap:10px;margin:0 0 8px}
  .calhead .m{font-family:var(--display);font-weight:700;font-size:17px;min-width:160px}
  .calwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0 4px;
           padding-bottom:4px}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:4px;min-width:740px}
  .cal .dow{font-size:11px;color:var(--faint);text-align:left;font-weight:600;
            padding:0 0 3px 3px;min-width:0}
  .cday{min-height:104px;border:1px solid var(--line);border-radius:9px;background:var(--card);
        padding:6px 6px 5px;display:flex;flex-direction:column;gap:3px;min-width:0}
  .cday.out{border:0;background:transparent;min-height:0}
  .cday.now{border-color:var(--ink);border-width:2px;padding:5px 5px 4px}
  .cday .n{font-size:13px;font-weight:600;line-height:1}
  .cday .evs{display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
  .cday .ev{font-size:10.5px;line-height:1.35;color:#fff;border-radius:4px;padding:1px 5px;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .cday .more{font-size:10px;color:var(--faint);padding-left:2px}
  button.cday{font:inherit;color:inherit;text-align:left;cursor:pointer;align-items:stretch}
  button.cday:hover{border-color:var(--faint)}
  .cday.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}

  .daybox{background:var(--card);border:1px solid var(--line);border-radius:13px;
          padding:14px 16px;margin:14px 0 0;max-width:600px}
  .dayhead{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 10px}
  .duty{display:flex;align-items:center;gap:9px;font-size:15px;margin-bottom:6px}
  .duty .swatch{width:10px;height:20px;border-radius:4px;flex:none}
  .dayitems{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line)}
  .dayitems li{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px}
  .dayitems em{width:9px;height:9px;border-radius:50%;flex:none;display:block}
  .dayitems .src{font-size:11px;color:var(--faint);border:1px solid var(--line);
                 border-radius:999px;padding:1px 8px;white-space:nowrap}
  .cday .dots{display:none;gap:3px;flex-wrap:wrap;margin-top:auto}
  .cday .dots i{width:6px;height:6px;border-radius:50%;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 0;font-size:12.5px;color:var(--slate)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:8px;height:8px;border-radius:50%;display:block}
  .evlist{margin:8px 0 0;padding:0;list-style:none;max-width:560px}
  .evlist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
  .evlist .d{color:var(--faint);font-size:12.5px;width:56px;flex:none}
  .evlist i{width:8px;height:8px;border-radius:50%;flex:none}
  .rotnows{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px;margin-bottom:20px}
  .rotnow{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
  .rotnow h4{font-family:var(--display);font-weight:700;font-size:14px;color:var(--slate);
             margin:0 0 9px;letter-spacing:.01em}
  .onnow{display:flex;align-items:center;gap:9px;font-size:16px;margin-bottom:4px}
  .onnow .swatch{width:12px;height:26px;border-radius:4px;background:var(--rc);flex:none}
  .onnow .until{color:var(--faint);font-size:12.5px;margin-left:5px;white-space:nowrap}

  .cday .bars{display:flex;gap:2px;margin-top:auto;padding-top:3px}
  .cday .bars i{height:5px;border-radius:3px;flex:1;display:block;min-width:5px}

  .periods{list-style:none;margin:6px 0 0;padding:0;max-width:600px}
  .periods li{display:flex;align-items:center;gap:10px;padding:9px 0;
              border-top:1px solid var(--line);font-size:15px}
  .periods li.on{font-weight:600}
  .periods .swatch{width:11px;height:22px;border-radius:4px;flex:none}
  .periods .range{color:var(--slate);font-size:13.5px;width:186px;flex:none;
                  font-variant-numeric:tabular-nums}
  .bdays li{padding:6px 0}
  .bdays em{width:9px;height:9px;border-radius:50%;flex:none;display:block}
  .bdays .range{width:88px}
  .periods .nowtag{font-size:11px;font-weight:600;background:var(--ink);color:var(--on-ink);
                   padding:2px 8px;border-radius:999px}
  .rules{margin:2px 0 0;padding-left:19px;color:var(--slate);font-size:13px;line-height:1.45}
  .rules li{margin-bottom:4px}
  .rules.wide{max-width:62ch;font-size:13.5px;margin:0 0 14px}
  .evlist em{width:8px;height:8px;border-radius:50%;flex:none;display:block}
  .legend em{width:8px;height:8px;border-radius:50%;display:block}
</style>

<style>
  /* ===== New look: deep evergreen + brass, light and dark ===== */
  :root{
    --ink:#16241e; --slate:#5b6a62; --faint:#8e9a93; --line:#dde3dd; --bg:#f5f6f2; --card:#ffffff;
    --hover:#eef1ec; --on-ink:#f5f6f2;
    --forest:#1b3529; --forest-ink:#eef2ea; --gilt:#d4b06e;
    --brass:#94702f; --brass-soft:#f3ead8;
    --good:#2e7650; --good-soft:#e3f0e8; --bad:#a8443a; --bad-soft:#f7e5e2;
    --c0:#3f7f8c; --c1:#9a6a33; --c2:#5f53a6; --c3:#a14a63; --c4:#2f7a52; --c5:#3a65a3; --c6:#857033; --c7:#3f7472;
    --shadow:0 1px 2px rgba(22,36,30,.06),0 8px 24px rgba(22,36,30,.08);
    --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
    --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ink:#e5eae5; --slate:#9daaa3; --faint:#6e7c75; --line:#26322c; --bg:#0f1613; --card:#16201b;
    --hover:#1c2722; --on-ink:#0f1613; --forest:#1a2f25; --forest-ink:#e9eee6; --gilt:#d4b06e;
    --brass:#d3ae6b; --brass-soft:#2b2518; --good:#6cc093; --good-soft:#16291f; --bad:#e08a7f; --bad-soft:#2e1a17;
    --c0:#79a7b6; --c1:#c39a63; --c2:#9d8fd0; --c3:#d18594; --c4:#6fb08b; --c5:#7d9fd6; --c6:#c2ad6a; --c7:#79b0ac;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }}
  :root[data-theme="dark"]{
    --ink:#e5eae5; --slate:#9daaa3; --faint:#6e7c75; --line:#26322c; --bg:#0f1613; --card:#16201b;
    --hover:#1c2722; --on-ink:#0f1613; --forest:#1a2f25; --forest-ink:#e9eee6; --gilt:#d4b06e;
    --brass:#d3ae6b; --brass-soft:#2b2518; --good:#6cc093; --good-soft:#16291f; --bad:#e08a7f; --bad-soft:#2e1a17;
    --c0:#79a7b6; --c1:#c39a63; --c2:#9d8fd0; --c3:#d18594; --c4:#6fb08b; --c5:#7d9fd6; --c6:#c2ad6a; --c7:#79b0ac;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

  html,body{height:100%}
  body{margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);
       font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .loading{color:var(--slate);text-align:center;padding:30vh 0;font-size:15px}

  /* shell */
  .board{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  .appbar{display:flex;align-items:center;gap:10px;padding:14px 28px 8px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// ===========================================================================
// Helpers
// ===========================================================================
const DAY = 86400000;
const uid = () => Math.random().toString(36).slice(2, 9);
const mod = (a, b) => ((a % b) + b) % b;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const PALETTE = ["--c0","--c1","--c2","--c3","--c4","--c5","--c6","--c7"];
const col = i => `var(${PALETTE[mod(i, PALETTE.length)]})`;

const isoOf = d => d.toISOString().slice(0, 10);
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); };
const todayUTC = () => { const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
const addDays = (d, n) => { const c = new Date(d); c.setUTCDate(c.getUTCDate() + n); return c; };
const mondayOf = d => addDays(d, -mod(d.getUTCDay() - 1, 7));
const fmtDay = d => d.toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short", timeZone:"UTC" });
const fmtShort = d => d.toLocaleDateString(undefined, { day:"numeric", month:"short", timeZone:"UTC" });

function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  if (m < 1440) return Math.round(m / 60) + "h ago";
  const d = Math.round(m / 1440);
  return d === 1 ? "yesterday" : d + "d ago";
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 3400);
}

// ===========================================================================
// State
// ===========================================================================
const S = {
  config: { zones: [], resources: [], cycleDays: 14, mode: "rotate", assign: {},
            anchor: isoOf(mondayOf(todayUTC())) },
  progress: {},
  trips: [],
  notes: [],
  bookings: [],
  birthdays: {},          // { memberId: "MM-DD" }
  roster: [],             // active members: {id, name, unit, is_manager}
  meetings: [], calls: [], votes: [], sugs: [], notices: []
};
let MEET_READY = false;

let CODE = null, ME = null, ROLE = "member", IS_MANAGER = false, IS_GUEST = false,
    MEMBERS = null, UNITS = [];
const ui = { tab:"cal", res:null, day:isoOf(todayUTC()), offset:0, filter:"open",
             replyTo:null, editZone:null, cal:null, selDay:null, q:"", caret:null, clearDates:false, editCode:null, pendingCode:null, focus:null,
             bookView:"schedule", showPast:false, confirmDel:null, recenter:true };

const SB = (SUPABASE_URL && SUPABASE_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const SHARED = !!SB;

const mem = {};
const local = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
};

let lastWrite = 0;
async function rpc(fn, args) {
  const { data, error } = await SB.rpc(fn, args);
  if (error) throw new Error(error.message.replace(/^.*?:\s*/, ""));
  return data;
}

// ===========================================================================
// Loading and saving
// ===========================================================================
function seedConfig() {
  S.config.zones = [
    { id: uid(), name:"Bathroom", slots:2, tasks:"Toilet, Shower, Sink, Mirror, Counter" },
    { id: uid(), name:"Stairs",   slots:1, tasks:"Sweep, Mop, Handrail, Landings" },
    { id: uid(), name:"Floors",   slots:2, tasks:"Hall, Lving room" }
  ];
  S.config.resources = ["Washing Machine","Kitchen Stove","Oven"].map(n => ({ id: uid(), name: n }));
}

async function loadAll() {
  if (!SHARED) {
    const saved = local.get("hb:solo");
    if (saved) Object.assign(S, saved);
    if (!S.config.zones.length) seedConfig();
    if (!S.roster.length) S.roster = [{ id:"me", name:"Joseph", unit:"Master A", is_manager:true }];
    ME = S.roster[0].id; ROLE = "manager"; IS_MANAGER = true; IS_GUEST = false;
    if (!ui.res) ui.res = S.config.resources[0]?.id || null;
    local.set("hb:solo", S);
    return;
  }

  const [cfg, docs, bk, ros] = await Promise.all([
    SB.from("config").select("data").eq("id", 1).maybeSingle(),
    SB.from("docs").select("key,data"),
    SB.from("bookings").select("*"),
    SB.rpc("roster", { p_code: CODE })
  ]);

  if (cfg.error || docs.error || bk.error) { toast("Can't reach the board right now."); return; }

  S.roster = ros.data || [];

  const un = await SB.from("units").select("name,sort").order("sort");
  if (un.data) UNITS = un.data;

  const c = cfg.data?.data;
  if (c && c.zones) Object.assign(S.config, c);
  else if (IS_MANAGER) { seedConfig(); await saveConfig(); }

  S.progress = {}; S.trips = []; S.notes = []; S.birthdays = {};
  (docs.data || []).forEach(r => {
    if (r.key === "progress") S.progress = r.data || {};
    if (r.key === "trips") S.trips = r.data?.list || [];
    if (r.key === "notes") S.notes = r.data?.list || [];
    if (r.key === "birthdays") S.birthdays = r.data || {};
  });
  S.bookings = bk.data || [];

  if (!ui.res) ui.res = S.config.resources[0]?.id || null;
  try { await loadMeetings(); } catch (e) { MEET_READY = false; }
}

async function loadMembers() {
  if (!SHARED || !IS_MANAGER) return;
  try {
    MEMBERS = await rpc("list_members", { p_code: CODE });
    const { data } = await SB.from("units").select("name,sort").order("sort");
    UNITS = data || [];
  } catch (e) { MEMBERS = []; }
}

async function saveConfig() {
  if (!SHARED) return local.set("hb:solo", S);
  lastWrite = Date.now();
  try { await rpc("save_config", { p_code: CODE, p_data: S.config }); }
  catch (e) { toast(e.message); await loadAll(); render(); }
}

async function saveDoc(key) {
  if (!SHARED) return local.set("hb:solo", S);
  lastWrite = Date.now();
  const payload = (key === "progress" || key === "birthdays") ? S[key] : { list: S[key] };
  try { await rpc("save_doc", { p_code: CODE, p_key: key, p_data: payload }); }
  catch (e) { toast(e.message); await loadAll(); render(); }
}

async function reloadBookings() {
  if (!SHARED) return;
  const { data } = await SB.from("bookings").select("*");
  if (data) S.bookings = data;
}

function subscribe() {
  if (!SB) return;
  const bump = () => {
    if (Date.now() - lastWrite < 1500) return;
    if (/INPUT|TEXTAREA/.test(document.activeElement?.tagName || "")) {
      return toast("Someone else changed the board — hit Refresh when you're done.");
    }
    loadAll().then(render);
  };
  SB.channel("house-board")
    .on("postgres_changes", { event:"*", schema:"public", table:"config" }, bump)
    .on("postgres_changes", { event:"*", schema:"public", table:"docs" }, bump)
    .on("postgres_changes", { event:"*", schema:"public", table:"bookings" }, bump)
    .on("postgres_changes", { event:"*", schema:"public", table:"meetings" }, bump)
    .on("postgres_changes", { event:"*", schema:"public", table:"meeting_calls" }, bump)
    .on("postgres_changes", { event:"*", schema:"public", table:"call_votes" }, bump)
    .on("postgres_changes", { event:"*", schema:"public", table:"suggestions" }, bump)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"notices" }, p => {
      const n = p.new || {};
      if (ROLE === "landlord" && !n.landlord) return;
      if (Date.now() - lastWrite > 1500) alertUser(n.title, n.body);
      bump();
    })
    .subscribe();
}

function slotList() {
  const out = [];
  S.config.zones.forEach(z => { for (let i = 0; i < z.slots; i++) out.push(z.id); });
  return out;
}
const cycleIndex = () => Math.floor((todayUTC() - parseISO(S.config.anchor)) / (S.config.cycleDays * DAY));
const cycleStart = n => addDays(parseISO(S.config.anchor), n * S.config.cycleDays);

// Priority: fixed assignment → this cycle's override → the rotation.
function assignFor(n) {
  const out = {}, rot = {};
  S.config.zones.forEach(z => { out[z.id] = []; rot[z.id] = []; });
  const pool = rotaPeople();
  if (pool.length) {
    slotList().forEach((zid, i) => rot[zid].push(pool[mod(i + n, pool.length)].id));
  }
  const override = (S.config.assign || {})[n] || {};
  S.config.zones.forEach(z => {
    out[z.id] = S.config.mode === "fixed" ? (z.people || []).slice()
              : override[z.id] ? override[z.id].slice()
              : rot[z.id];
    out[z.id] = out[z.id].filter(id => person(id));       // drop anyone who's moved out
  });
  return out;
}

function renderClean() {
  const n = cycleIndex() + ui.offset;
  const a = assignFor(n);
  const done = S.progress[n] || {};
  const start = cycleStart(n), end = addDays(cycleStart(n + 1), -1);
  const daysLeft = Math.round((cycleStart(cycleIndex() + 1) - todayUTC()) / DAY);
  const override = (S.config.assign || {})[n] || {};
  const fixed = S.config.mode === "fixed";

  const zones = S.config.zones.map((z, i) => {
    const editing = IS_MANAGER && ui.editZone === z.id;
    return `
    <article class="zone ${done[z.id] ? "done" : ""}" style="--accent:${col(i)};--tint:${col(i)}12">
      <h3>${esc(z.name)}</h3>
      <p class="tasks">${z.tasks ? esc(z.tasks) : "&nbsp;"}</p>

      ${editing ? `
        <div class="pick">${rotaPeople().map(p => `
          <button data-action="toggle-person" data-id="${z.id}" data-id2="${p.id}"
                  aria-pressed="${a[z.id].includes(p.id)}">${esc(p.name)}</button>`).join("")}</div>
        <p class="byhand">${a[z.id].length} of ${z.slots} ${z.slots === 1 ? "spot" : "spots"} filled${
          fixed ? "" : " · this cycle only"}</p>
        <div class="foot">
          <button class="btn tiny solid" data-action="edit-zone" data-id="${z.id}">Done</button>
          ${!fixed && override[z.id]
            ? `<button class="btn ghost tiny" data-action="clear-override" data-id="${z.id}">Back to rotation</button>` : ""}
        </div>`
      : `
        <div class="people">${a[z.id].map(id => chip(id)).join("") || '<span class="tasks">Nobody assigned</span>'}</div>
        ${override[z.id] && !fixed ? `<p class="byhand">Set by hand for this cycle</p>` : ""}
        <div class="foot">
          <button class="tick" data-action="tick" data-id="${z.id}">
            <span class="box">✓</span>${done[z.id] ? "Cleaned" : "Mark Cleaned"}
          </button>
          ${IS_MANAGER ? `<span>
            <button class="btn ghost tiny" data-action="edit-zone" data-id="${z.id}">Change Who</button>
            <button class="btn ghost tiny" data-action="del-zone" data-id="${z.id}">Remove</button></span>` : ""}
        </div>`}
    </article>`; }).join("");

  return `
    <h2 class="sec">Cleaning Rotation</h2>
    <p class="lede">Areas don't need to be too clean, just enough to maintain clean and healthy living area(No hair or dust). Areas rotate automatically. Everyone moves along one place each cycle.</p>

    <div class="cyclebar">
      <button class="btn tiny" data-action="cyc" data-id="-1">←</button>
      <span class="pill">${fmtShort(start)} – ${fmtShort(end)}</span>
      <button class="btn tiny" data-action="cyc" data-id="1">→</button>
      ${ui.offset === 0
        ? `<span class="sub">Swaps in ${daysLeft} day${daysLeft === 1 ? "" : "s"}</span>`
        : `<button class="btn ghost tiny" data-action="cyc" data-id="0">Back to now</button>`}
    </div>

    ${S.config.zones.length ? `<div class="zones">${zones}</div>` : `<p class="empty">No areas set up yet.</p>`}

    ${IS_MANAGER ? `
      <h3 class="sub-h">Add an area</h3>
      <div class="row">
        <label class="stack">Name<input id="zName" placeholder="Kitchen" data-enter="add-zone" style="width:170px"></label>
        <label class="stack">People<input id="zSlots" type="number" min="1" max="9" value="1" style="width:78px"></label>
        <label class="stack">What it covers<input id="zTasks" placeholder="Counters, sink, etc." data-enter="add-zone" style="width:230px"></label>
        <button class="btn solid" data-action="add-zone">Add area</button>
      </div>

      <h3 class="sub-h">Rotation settings</h3>
      <div class="row">
        <label class="stack">Who's on What
          <select data-change="mode">

            <option value="fixed"  ${fixed ? "selected" : ""}>I set it, stays put</option>
          </select>
        </label>
        ${fixed ? "" : `
          <label class="stack">Rotate Every
            <select data-change="cycle-len">
              <option value="7"  ${S.config.cycleDays == 7  ? "selected" : ""}>1 week</option>
              <option value="14" ${S.config.cycleDays == 14 ? "selected" : ""}>2 weeks</option>

// ===========================================================================
// Landlord rotations + calendar
// ---------------------------------------------------------------------------
// The landlord's two rotations don't line up with months or with each other,
// so they're stored as date ranges (MM-DD, no year) that repeat annually. That
// also handles the indoor one running across new year. All of it sits in
// `config`, which the database already restricts to the manager.
// ===========================================================================
const MONTH_NAMES = ["January","February","March","April","May","June",
                     "July","August","September","October","November","December"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const KINDS = {                       // the kinds you can pick when adding a date
  off:   { label:"Day off",  color:"var(--c4)" },
  utm:   { label:"UTM",      color:"var(--c5)" },
  house: { label:"House",    color:"var(--c1)" }
};
// Grocery runs aren't stored here — they're read straight off the Grocery tab,
// so posting a run puts it on the calendar and cancelling one takes it off.
const KIND_COLOR = { off:"var(--c4)", utm:"var(--c5)", house:"var(--c1)",
                     shop:"var(--c0)", bday:"var(--c3)", meet:"var(--brass)" };

function dayItems(iso) {
  const out = ll().dates.filter(d => d.to ? (iso >= d.date && iso <= d.to) : d.date === iso)
    .map(d => ({ id:d.id, kind:d.kind || "house", label:d.label, removable:true,
                 span: d.to && d.to !== d.date ? `${fmtFull(d.date)} – ${fmtFull(d.to)}` : null }));
  Object.entries(S.birthdays || {}).forEach(([id, md]) => {
    if (md && iso.slice(5) === md && person(id))
      out.push({ id: "b" + id, kind: "bday", removable: false,
                 label: `${nameOf(id)}'s birthday` });
  });
  (S.meetings || []).forEach(m => {
    const st = new Date(m.starts_at);
    if (localIso(st) === iso) out.unshift({ id: m.id, kind: "meet", removable: false,
      label: `Group meeting · ${span(st, m.ends_at ? new Date(m.ends_at) : null)}${m.landlord ? " · landlord" : ""}` });
  });
  S.trips.filter(t => t.date === iso).forEach(t => out.push({
    id: t.id, kind: "shop", removable: false,
    label: `${t.store}${t.time ? " · " + t.time : ""}`,
    going: t.going || []
  }));
  return out;
}

let migrated = false;

function ll() {
  if (!S.config.landlord) S.config.landlord = {};
  const l = S.config.landlord;
  if (!Array.isArray(l.rotations) || !l.rotations.length) l.rotations = SEED_ROTATIONS();
  if (!Array.isArray(l.dates)) l.dates = [];
  // v1 stored MM-DD and repeated yearly; the real schedule has years on it.
  if (l.v !== 3) {
    if (l.v !== 2) l.rotations = SEED_ROTATIONS();          // v1 repeated yearly
    else l.rotations.forEach(r => r.periods.forEach(p => {  // v2 called it Upper A
      if (p.unit === "Upper A") p.unit = "Ground A";
    }));
    l.v = 3;
    if (!migrated && IS_MANAGER) { migrated = true; saveConfig(); }
  }
  return l;
}

// --- rooms and their colours ----------------------------------------------
const unitList = () => (UNITS.length ? UNITS.map(u => u.name)
                                     : ["Ground A","Upper B","Upper C","Upper D","Master A"]);
const unitColor = name => {
  const i = unitList().indexOf(name);
  return col(i < 0 ? 7 : i);
};
const whoIn = unit => {
  const p = people().find(x => x.unit === unit);
  return p ? p.name : "";
};

// --- plain date ranges ----------------------------------------------------
const inPeriod = (iso, p) => iso >= p.from && iso <= p.to;
const fmtFull = iso => {
  const [y, m, d] = iso.split("-").map(Number);
  return `${MON[m-1]} ${d}, ${y}`;
};
const activeIn = (rot, iso) => rot.periods.filter(p => inPeriod(iso, p));

const calKey = () => ui.cal || (ui.cal = isoOf(todayUTC()).slice(0, 7));
function shiftMonth(key, by) {
  const [y, m] = key.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1 + by, 1)).toISOString().slice(0, 7);
}

// --- Ontario statutory holidays, worked out rather than typed in -----------
function nthDow(y, m, dow, n) {
  const first = new Date(Date.UTC(y, m - 1, 1));
  return new Date(Date.UTC(y, m - 1, 1 + mod(dow - first.getUTCDay(), 7) + (n - 1) * 7));
}
function easterSunday(y) {
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7,
        m=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(y, mo - 1, day));
}
function ontarioHolidays(y) {
  const may25 = new Date(Date.UTC(y, 4, 25));
  const victoria = addDays(may25, -(mod(may25.getUTCDay() - 1, 7) || 7));
  return [
    ["New Year's Day", new Date(Date.UTC(y, 0, 1))],
    ["Family Day",     nthDow(y, 2, 1, 3)],
    ["Good Friday",    addDays(easterSunday(y), -2)],
    ["Victoria Day",   victoria],
    ["Canada Day",     new Date(Date.UTC(y, 6, 1))],
    ["Civic Holiday",  nthDow(y, 8, 1, 1)],
    ["Labour Day",     nthDow(y, 9, 1, 1)],
    ["Thanksgiving",   nthDow(y, 10, 1, 2)],
    ["Christmas Day",  new Date(Date.UTC(y, 11, 25))],
    ["Boxing Day",     new Date(Date.UTC(y, 11, 26))]
  ].map(([label, d]) => ({ label, date: isoOf(d) }));
}

// One row per event, not one per day — a range stays a single line.
function searchCal(q) {
  const t = q.trim().toLowerCase();
  if (!t) return [];
  const out = [];
  ll().dates.forEach(d => {
    if (d.label.toLowerCase().includes(t))
      out.push({ kind: d.kind || "house", label: d.label, from: d.date, to: d.to || d.date, id: d.id });
  });
  S.trips.forEach(tr => {
    const hay = `${tr.store} ${tr.note || ""} grocery run`.toLowerCase();
    if (hay.includes(t))
      out.push({ kind:"shop", label:`${tr.store}${tr.time ? " · " + tr.time : ""}`,
                 from: tr.date, to: tr.date, id: tr.id });
  });
  Object.entries(S.birthdays || {}).forEach(([id, md]) => {
    const p = person(id); if (!p || !md) return;
    if (`${p.name} birthday`.toLowerCase().includes(t))
      out.push({ kind:"bday", label:`${p.name}'s birthday`, md, id:"b" + id });
  });
  (S.meetings || []).forEach(m => {
    if ("group meeting".includes(t) || (m.agenda || "").toLowerCase().includes(t)) {
      const d = localIso(new Date(m.starts_at));
      out.push({ kind:"meet", label:`Group meeting${m.agenda ? " · " + m.agenda : ""}`, from:d, to:d, id:m.id });
    }
  });
  return out.sort((a, b) => (a.from || a.md).localeCompare(b.from || b.md));
}

function renderCal() {
  const l = ll();
  const key = calKey();
  const [Y, M] = key.split("-").map(Number);
  const today = isoOf(todayUTC());

  // ---- who's on duty right now
  const nowCards = l.rotations.map(rot => {
    const act = activeIn(rot, today);
    const body = act.length
      ? act.map(p => `<div class="onnow" style="--rc:${unitColor(p.unit)}">
           <span class="swatch"></span>
           <span><b>${esc(p.unit)}</b>${whoIn(p.unit) ? ` · ${esc(whoIn(p.unit))}` : ""}
             <span class="until">until ${fmtFull(p.to)}</span></span>
         </div>`).join("")
      : `<p class="sub" style="margin:0">Nobody assigned right now.</p>`;
    return `<article class="rotnow">
      <h4>${esc(rot.name)}</h4>
      ${body}
      ${(rot.rules || []).length
        ? `<ol class="rules">${rot.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ol>` : ""}
    </article>`;
  }).join("");

  // ---- month grid
  const first = new Date(Date.UTC(Y, M - 1, 1));
  const pad = mod(first.getUTCDay() - 1, 7);
  const total = new Date(Date.UTC(Y, M, 0)).getUTCDate();
  const byDate = {};
  l.dates.forEach(d => (byDate[d.date] = byDate[d.date] || []).push(d));

  const picked = ui.selDay && ui.selDay.startsWith(key) ? ui.selDay
               : (today.startsWith(key) ? today : null);

  let cells = DOW.map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < pad; i++) cells += `<div class="cday out"></div>`;
  for (let d = 1; d <= total; d++) {
    const iso = `${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const items = dayItems(iso);
    const shown = items.slice(0, 3).map(e =>
      `<span class="ev" style="background:${KIND_COLOR[e.kind] || KIND_COLOR.house}"
             title="${esc(e.label)}">${esc(e.label)}</span>`).join("");
    const more = items.length > 3 ? `<span class="more">+${items.length - 3} more</span>` : "";
    const bars = l.rotations.map(rot => activeIn(rot, iso)
      .map(p => `<i style="background:${unitColor(p.unit)}" title="${esc(rot.name)}: ${esc(p.unit)}"></i>`)
      .join("")).join("");
    cells += `<button class="cday ${iso === today ? "now" : ""} ${iso === picked ? "sel" : ""}"
        data-action="cal-day" data-id="${iso}" aria-label="${esc(iso)}, ${items.length} item${items.length === 1 ? "" : "s"}">
      <span class="n">${d}</span>
      <span class="evs">${shown}${more}</span>
      <span class="bars">${bars}</span>
      <span class="dots">${items.map(e => `<i style="background:${KIND_COLOR[e.kind] || KIND_COLOR.house}"></i>`).join("")}</span>
    </button>`;
  }

  // ---- the day you tapped, spelled out in full
  let dayBox = "";
  if (picked) {
    const items = dayItems(picked);
    const duties = l.rotations.map(rot => activeIn(rot, picked).map(p =>
      `<div class="duty"><span class="swatch" style="background:${unitColor(p.unit)}"></span>
        <span><b>${esc(p.unit)}</b>${whoIn(p.unit) ? ` · ${esc(whoIn(p.unit))}` : ""}
        <span class="sub" style="font-size:12.5px"> — ${esc(rot.name)}</span></span></div>`).join("")).join("");
    const rows = items.map(e => `
      <li>
        <em style="background:${KIND_COLOR[e.kind] || KIND_COLOR.house}"></em>
        <span style="flex:1">${esc(e.label)}${
          e.span ? `<span class="sub" style="font-size:12.5px"> — ${e.span}</span>` : ""}${
          e.kind === "shop" && e.going.length
            ? `<span class="sub" style="font-size:12.5px"> — ${e.going.map(id => esc(nameOf(id))).join(", ")} going</span>`
            : ""}</span>
        ${e.kind === "shop" ? `<span class="src">Grocery Runs</span>` : ""}
        ${e.kind === "bday" ? `<span class="src">Birthday</span>` : ""}
        ${e.kind === "meet" ? `<span class="src">Group Meeting</span>` : ""}
        ${IS_MANAGER && e.removable
          ? `<button class="btn ghost tiny" data-action="del-date" data-id="${e.id}">Remove</button>` : ""}
      </li>`).join("");
    dayBox = `<div class="daybox">
      <p class="dayhead">${fmtDay(parseISO(picked))}</p>
      ${duties || ""}
      ${rows ? `<ul class="dayitems">${rows}</ul>`
             : `<p class="sub" style="margin:8px 0 0">Nothing else on this day.</p>`}
    </div>`;
  }

  // ---- rotation periods listed out
  const rotLists = l.rotations.map(rot => {
    const rows = rot.periods.slice()
      .sort((a, b) => a.from.localeCompare(b.from))
      .map(p => {
        const on = inPeriod(today, p);
        return `<li class="${on ? "on" : ""}">
          <span class="swatch" style="background:${unitColor(p.unit)}"></span>
          <span class="range">${fmtFull(p.from)} – ${fmtFull(p.to)}</span>
          <span style="flex:1"><b>${esc(p.unit)}</b>${whoIn(p.unit) ? ` · ${esc(whoIn(p.unit))}` : ""}</span>
          ${on ? `<span class="nowtag">now</span>` : ""}
          ${IS_MANAGER ? `<button class="btn ghost tiny" data-action="del-period"
              data-id="${rot.id}" data-id2="${p.id}">Remove</button>` : ""}
        </li>`;
      }).join("");
    const unitOpts = unitList().map(u => `<option>${esc(u)}</option>`).join("");
    return `
      <h3 class="sub-h">${esc(rot.name)}</h3>
      ${(rot.rules || []).length
        ? `<ol class="rules wide">${rot.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ol>` : ""}
      <ul class="periods">${rows}</ul>
      ${IS_MANAGER ? `
        <div class="row" style="margin-top:10px">
          <label class="stack">Room<select id="pu-${rot.id}">${unitOpts}</select></label>
          <label class="stack">From<input id="pf-${rot.id}" type="date"></label>
          <label class="stack">To<input id="pt-${rot.id}" type="date"></label>
          <button class="btn" data-action="add-period" data-id="${rot.id}">Add period</button>
        </div>` : ""}`;
  }).join("");

  return `
    <h2 class="sec">Calendar</h2>
    <p class="lede">The landlord's rotations and the dates worth knowing. Separate from our own cleaning rota.</p>

    <div class="rotnows">${nowCards}</div>

    <div class="row" style="margin:0 0 16px">
      <input id="calSearch" data-input="cal-search" value="${esc(ui.q || "")}"
             placeholder="Search dates — try &quot;last day&quot; or &quot;exam&quot;"
             style="flex:1;min-width:220px;max-width:420px" aria-label="Search dates">
      ${ui.q ? `<button class="btn ghost tiny" data-action="clear-search">Clear</button>` : ""}
    </div>
    ${(() => {
      if (!ui.q) return "";
      const hits = searchCal(ui.q);
      if (!hits.length) return `<p class="empty" style="margin-bottom:18px">Nothing matches “${esc(ui.q)}”.</p>`;
      const rows = hits.map(h => `
        <li>
          <em style="background:${KIND_COLOR[h.kind] || KIND_COLOR.house}"></em>
          <span class="when">${h.md
            ? `${MON[Number(h.md.split("-")[0]) - 1]} ${Number(h.md.split("-")[1])} · every year`
            : (h.to && h.to !== h.from ? `${fmtFull(h.from)} ~ ${fmtFull(h.to)}` : fmtFull(h.from))}</span>
          <span style="flex:1">${esc(h.label)}</span>
        </li>`).join("");
      return `<div class="results">
        <p class="sub" style="margin:0 0 6px">${hits.length} match${hits.length === 1 ? "" : "es"}</p>
        <ul class="hitlist">${rows}</ul></div>`;
    })()}

    <h3 class="sub-h">${MONTH_NAMES[M-1]} ${Y}</h3>
    <div class="calhead">
      <button class="btn tiny" data-action="cal-prev">←</button>
      <button class="btn tiny" data-action="cal-next">→</button>
      ${key === today.slice(0,7) ? "" : `<button class="btn ghost tiny" data-action="cal-today">Back to now</button>`}
    </div>
    <div class="calwrap"><div class="cal">${cells}</div></div>

async function member(id, fields) {
  try { await rpc("set_member", Object.assign({ p_code: CODE, p_id: id }, fields)); await loadMembers(); }
  catch (e) { toast(e.message); await loadMembers(); render(); }
}

const changers = {

  },
  "cycle-len": el => { S.config.cycleDays = Number(el.value); saveConfig(); render(); },
  anchor: el => {
    if (!el.value) return render();
    S.config.anchor = isoOf(mondayOf(parseISO(el.value)));
    S.progress = {};
    saveConfig(); saveDoc("progress"); render();
  },
  item: el => {
    const t = S.trips.find(x => x.id === el.dataset.id);
    const it = t.items.find(x => x.id === el.dataset.id2);

  "m-name": async el => { await member(el.dataset.id, { p_name: el.value.trim() }); await loadAll(); render(); },
  "m-unit": async el => { await member(el.dataset.id, { p_unit: el.value }); await loadAll(); render(); },

// A guest sees the board exactly as everyone else does — every button is there,
// none of them do anything. The database refuses them too, so this is manners
// rather than security.
const GUEST_MAY = new Set(["tab","refresh","signout","cyc","filter",
                           "cal-prev","cal-next","cal-today","cal-day",
                           "pick-res","pick-day","edit-zone","reply",
                           "home","notifs","theme","open-sug","close","show-past","bview","allow-notifs","del-meet-no"]);
const shoo = () => toast("No guests allowed in the house! >:(");

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (IS_GUEST && !GUEST_MAY.has(a)) return shoo();
  if (actions[a]) actions[a](el, el.dataset.id);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]");
  if (!el) return;
  if (IS_GUEST) { shoo(); return render(); }
  if (changers[el.dataset.change]) changers[el.dataset.change](el);
});
document.addEventListener("input", e => {
  const el = e.target.closest("[data-input]");
  if (!el || el.dataset.input !== "cal-search") return;
  ui.q = el.value;
  ui.focus = "calSearch";
  ui.caret = el.selectionStart;    // otherwise focus() drops it back to position 0
  render();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const el = e.target.closest("[data-enter]");
  if (!el) return;
  e.preventDefault();
  if (IS_GUEST) return shoo();
  if (actions[el.dataset.enter]) actions[el.dataset.enter](el, el.dataset.id);
});

const ic = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WDL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const localIso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtD = d => `${WD[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`;
const fmtT = d => { let h = d.getHours(); const m = d.getMinutes(), ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };
function span(st, en) {
  if (!en) return fmtT(st);
  const a = fmtT(st), b = fmtT(en);
  return (a.slice(-2) === b.slice(-2) ? a.slice(0, -3) : a) + " – " + b;
}
const dayWord = d => sameDay(d, new Date()) ? "Today" : sameDay(d, new Date(Date.now() + DAY)) ? "Tomorrow" : fmtD(d);
const fromInputs = (d, t) => { if (!d || !t) return null; const [y,m,dd] = d.split("-").map(Number), [h,mi] = t.split(":").map(Number); return new Date(y, m-1, dd, h, mi); };
const toInputs = d => [localIso(d), `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`];
