const KIND_LABEL = { rule:"Rule", issue:"Issue", idea:"Idea", notice:"Notice" };
const mStart = m => new Date(m.starts_at);
const mEnd = m => m.ends_at ? new Date(m.ends_at) : new Date(mStart(m).getTime() + 2*3600000);
const meetingsAhead = () => S.meetings.filter(m => mEnd(m) > new Date()).sort((a, b) => mStart(a) - mStart(b));
const meetingById = id => S.meetings.find(m => m.id === id);
const openCall = () => S.calls.find(c => c.status === "open" && new Date(c.starts_at) > new Date());
const voters = c => S.roster.filter(p => p.role === "member" || p.role === "manager" || !p.role || (p.role === "landlord" && c.landlord));
const voteOf = (c, id) => (S.votes.find(v => v.call_id === c.id && v.member_id === id) || {}).vote || null;
const fileUrl = f => SB ? SB.storage.from("meeting-files").getPublicUrl(f.path).data.publicUrl : "";
const authorName = s => (person(s.author_id) || {}).name || s.author_name || "A former housemate";

async function loadMeetings() {
  if (!SHARED) return;
  const [m, c, v, s, n] = await Promise.all([
    SB.from("meetings").select("*").order("starts_at"),
    SB.from("meeting_calls").select("*").eq("status", "open"),
    SB.from("call_votes").select("*"),
    SB.from("suggestions").select("*").order("created_at", { ascending:false }),
    SB.from("notices").select("*").order("created_at", { ascending:false }).limit(30)
  ]);
  MEET_READY = !m.error;
  S.meetings = m.data || []; S.calls = c.data || []; S.votes = v.data || [];
  S.sugs = s.data || [];
  S.notices = (n.data || []).filter(x => ROLE !== "landlord" || x.landlord);
}

function renderMeet() {
  if (SHARED && !MEET_READY) return `
    <p class="eyebrow">Group Meeting</p><h2 class="sec">Almost there</h2>
    <p class="lede">The meeting tables haven't been added to the database yet. ${IS_MANAGER
      ? "Run meetings.sql in Supabase → SQL Editor, then refresh." : `Ask ${esc(managerName())} to finish setting it up.`}</p>`;
  const ahead = meetingsAhead(), next = ahead[0], after = ahead[1], now = new Date();
  let card;
  if (next) {
    const st = mStart(next), en = mEnd(next), live = st <= now;
    const mins = Math.max(0, Math.round((st - now) / 60000));
    const until = live ? "happening now" : mins < 60 ? `in ${mins} min` : mins < 1440 ? `in ${Math.floor(mins/60)} h ${mins%60} min` : `in ${Math.round(mins/1440)} days`;
    const remind = new Date(st.getTime() - 3600000);
    card = `<section class="next">
      <p class="eyebrow">Next meeting · ${until}</p>
      <div class="when">${sameDay(st, now) ? (st.getHours() >= 17 ? "Tonight" : "Today") : fmtD(st)}, ${span(st, next.ends_at ? en : null)}</div>
      <div class="meta">${fmtD(st)}${next.place ? " · " + esc(next.place) : ""}</div>
      ${next.landlord ? `<div class="remind gilt">${ic("check")}Landlord is attending</div>` : ""}
      ${next.agenda ? `<div class="agenda"><span>Agenda</span>${esc(next.agenda)}</div>` : ""}
      ${!live && remind > now ? `<div class="remind">${ic("bell")}Reminder goes out at ${fmtT(remind)}</div>` : ""}
      ${IS_MANAGER ? (ui.confirmDel === next.id
        ? `<div class="confirmbar">Delete this meeting for everyone?
             <button class="btn tiny" data-action="del-meet" data-id="${next.id}">Yes, delete</button>
             <button class="btn tiny" data-action="del-meet-no">Keep it</button></div>`
        : `<div class="row">
             <button class="btn tiny" data-action="set-meet">${ic("plus")}Set next meeting</button>
             <button class="btn tiny" data-action="edit-meet" data-id="${next.id}">${ic("edit")}Change</button>
             <button class="btn tiny" data-action="toggle-ll" data-id="${next.id}">${next.landlord ? "Remove landlord" : "Include landlord"}</button>
             <button class="btn tiny" data-action="ask-del-meet" data-id="${next.id}">${ic("trash")}Delete</button></div>`) : ""}
      ${after ? `<p style="opacity:.6;margin:14px 0 0;font-size:13px">After that: ${fmtD(mStart(after))}, ${span(mStart(after), after.ends_at ? mEnd(after) : null)}</p>` : ""}
    </section>`;
  } else {
    card = `<section class="next"><p class="eyebrow">Next meeting</p>
      <div class="when">Not set yet</div>
      <div class="meta">The next date is usually decided at the meeting before.</div>
      ${IS_MANAGER ? `<div class="row"><button class="btn tiny" data-action="set-meet">${ic("plus")}Set next meeting</button></div>` : ""}</section>`;
  }

  const c = openCall();
  let side;
  if (c) {
    const vs = voters(c), yes = vs.filter(p => voteOf(c, p.id) === "yes").length;
    const mine = voteOf(c, ME), canVote = vs.some(p => p.id === ME);
    const rep = meetingById(c.replaces), cs = new Date(c.starts_at);
    side = `<section class="card call">
      <div class="gline" style="margin:0"><p class="eyebrow">Early meeting called</p><span class="sub" style="margin:0;font-size:12.5px">by ${esc((person(c.called_by)||{}).name || c.caller_name || "someone")}</span></div>
      <h4>${fmtD(cs)} · ${span(cs, c.ends_at ? new Date(c.ends_at) : null)}</h4>
      ${c.note ? `<p class="sub" style="margin:0">${esc(c.note)}</p>` : ""}
      <div class="row" style="margin-top:8px">${rep ? `<span class="pl plain">Replaces ${fmtD(mStart(rep))}</span>` : ""}${c.landlord ? `<span class="pl brass">Landlord included</span>` : ""}</div>
      <div class="votes">${vs.map(p => { const v = voteOf(c, p.id);
        return `<span class="vote ${v || ""}"><span class="badge sm" style="background:${col(pIndex(p.id))}">${esc(initials(p.name))}</span>${esc(p.name)}
          <span class="st">${v === "yes" ? "Free" : v === "no" ? "Can't" : "Waiting"}</span></span>`; }).join("")}</div>
      <div class="bar"><i style="width:${vs.length ? yes / vs.length * 100 : 0}%"></i></div>
      <p class="sub" style="margin:8px 0 14px;font-size:12.5px">${yes} of ${vs.length} free. It goes on the calendar only when everyone says yes${rep ? `, and replaces the ${fmtD(mStart(rep))} meeting` : ""}.</p>
      <div class="row">
        ${canVote ? `<button class="btn ${mine === "yes" ? "solid" : ""}" data-action="vote" data-id="yes">${ic("check")}I'm free</button>
        <button class="btn ${mine === "no" ? "solid" : ""}" data-action="vote" data-id="no">Can't make it</button>` : `<span class="sub" style="margin:0">You don't vote on this one.</span>`}
        ${c.called_by === ME || IS_MANAGER ? `<button class="btn ghost tiny" data-action="cancel-call">Withdraw</button>` : ""}
      </div></section>`;
  } else {
    side = `<section class="card"><p class="eyebrow">Need to meet sooner?</p>
      <p class="sub" style="margin:8px 0 14px">Tap the calendar button to suggest an earlier time. Everyone gets a notification and votes on it.</p>
      <button class="btn" data-action="call">${ic("cal")}Call an early meeting</button></section>`;
  }

  // suggestions grouped by the meeting they'll be discussed at
  const row = s => `<button class="sug" data-action="open-sug" data-id="${s.id}">
      <span class="kind k-${s.kind}">${KIND_LABEL[s.kind] || "Idea"}</span>
      <span class="t"><b>${esc(s.title)}</b><span>${meetingById(s.meeting_id) ? "Discussed " + fmtD(mStart(meetingById(s.meeting_id))) : "Next meeting"} · ${esc(authorName(s))}</span></span>
      ${(s.files || []).length ? `<span class="clip">${ic("clip")}${s.files.length}</span>` : ""}</button>`;
  const groups = ahead.map(m => ({ label:`For ${fmtD(mStart(m))}`, list:S.sugs.filter(s => s.meeting_id === m.id) })).filter(g => g.list.length);
  const loose = S.sugs.filter(s => !meetingById(s.meeting_id));
  if (loose.length) groups.push({ label:"For the next meeting", list:loose });
  const past = S.sugs.filter(s => { const m = meetingById(s.meeting_id); return m && mEnd(m) <= new Date(); });
  const list = groups.map(g => `<div class="gline"><h3 class="sub-h">${g.label}</h3><span class="sub" style="margin:0;font-size:12px">${g.list.length} item${g.list.length === 1 ? "" : "s"}</span></div>
    <div class="sugs">${g.list.map(row).join("")}</div>`).join("");

  return `
    <p class="eyebrow">Group Meeting</p>
    <h2 class="sec">Talk it through, together</h2>
    <p class="lede">Post anything the house should decide on. Each suggestion is listed under the meeting it will be discussed at.</p>
    <div class="meetgrid">${card}${side}</div>
    ${list || `<p class="empty">No suggestions yet. Tap + to add the first one.</p>`}
    ${past.length ? `<div class="gline"><h3 class="sub-h">Earlier meetings</h3>
      <button class="btn ghost tiny" data-action="show-past">${ui.showPast ? "Hide" : `Show ${past.length}`}</button></div>
      ${ui.showPast ? `<div class="sugs">${past.map(row).join("")}</div>` : ""}` : ""}`;
}

// ===========================================================================
// Modals
// ===========================================================================
let draft = null;
function openModal(title, html) {
  document.getElementById("modal").innerHTML = `<div class="mhead"><button class="iconbtn" data-action="close" aria-label="Close">${ic("close")}</button><b>${title}</b></div><div class="mbody">${html}</div>`;
  document.getElementById("modal").classList.add("on"); document.getElementById("scrim").classList.add("on");
}
function closeModal() { document.getElementById("modal").classList.remove("on"); document.getElementById("scrim").classList.remove("on"); draft = null; }
const fileTile = f => {
  const url = f.src || fileUrl(f), img = (f.type || "").startsWith("image/");
  return `<a class="file" ${f.src ? "" : `href="${esc(url)}" target="_blank" rel="noopener"`}><div class="th">${img ? `<img src="${esc(url)}" alt="" loading="lazy">` : ic("doc")}</div><div class="fn">${esc(f.name)}</div></a>`;
};

function openSug(id) {
  const s = S.sugs.find(x => x.id === id); if (!s) return;
  const can = !IS_GUEST && (s.author_id === ME || IS_MANAGER), m = meetingById(s.meeting_id), at = new Date(s.created_at);
  openModal("Suggestion", `
    <div class="row"><span class="kind k-${s.kind}" style="width:auto">${KIND_LABEL[s.kind]}</span>
      <span class="pl brass">${ic("cal")}${m ? fmtD(mStart(m)) + " meeting" : "Next meeting"}</span></div>
    <h2>${esc(s.title)}</h2>
    <div class="row">${s.author_id && person(s.author_id) ? chip(s.author_id, true) : `<b>${esc(authorName(s))}</b>`}
      <span class="sub" style="margin:0;font-size:12.5px">posted ${fmtD(at)}, ${fmtT(at)}</span></div>
    ${s.body ? `<p class="body">${esc(s.body)}</p>` : ""}
    ${(s.files || []).length ? `<div><h3 class="sub-h" style="margin:0 0 8px">Attached</h3><div class="files">${s.files.map(fileTile).join("")}</div></div>` : ""}
    <div class="notice">${ic("lock")}<span>Suggestions can't be edited once posted. ${can ? (s.author_id === ME ? "You can delete yours." : "As the manager you can delete any suggestion.") : "Only the person who posted it, or the manager, can delete it."}</span></div>
    ${can ? `<div id="delZone"><button class="btn danger" data-action="ask-del-sug" data-id="${s.id}">${ic("trash")}Delete suggestion</button></div>` : ""}`);
}

function openNew() {
  draft = { kind:"rule", files:[] };
  const opts = meetingsAhead().filter(m => mStart(m) > new Date()).map(m => `<option value="${m.id}">${fmtD(mStart(m))}, ${fmtT(mStart(m))}</option>`).join("");
  openModal("New suggestion", `
    <div class="kinds" id="kinds">${Object.entries(KIND_LABEL).map(([k, l]) => `<button aria-pressed="${k === "rule"}" data-action="kind" data-id="${k}">${l}</button>`).join("")}</div>
    <label class="f">Title<input id="nTitle" maxlength="120" placeholder="e.g. Quiet hours after midnight"></label>
    <label class="f">Details<textarea id="nBody" placeholder="What's happening, and what do you suggest?"></textarea></label>
    <label class="f">Discuss at<select id="nMeet">${opts || `<option value="">The next meeting, once it's set</option>`}</select></label>
    <div><label class="drop" for="nFiles">${ic("clip")} Add photos or documents</label>
      <input id="nFiles" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt" hidden>
      <div class="files" id="nList" style="margin-top:10px"></div></div>
    <div class="notice">${ic("lock")}<span>Once posted, a suggestion can't be edited. You can still delete it.</span></div>
    <button class="btn brass wide" data-action="post-sug" id="postSug">Post suggestion</button>`);
  document.getElementById("nFiles").addEventListener("change", e => {
    [...e.target.files].forEach(file => {
      if (file.size > 10 * 1024 * 1024) return toast(`${file.name} is over 10 MB.`);
      const item = { name:file.name, type:file.type || "application/octet-stream", file };
      draft.files.push(item);
      if (item.type.startsWith("image/")) { const r = new FileReader(); r.onload = () => { item.src = r.result; drawDraftFiles(); }; r.readAsDataURL(file); }
    });
    e.target.value = ""; drawDraftFiles();
  });
}
const drawDraftFiles = () => { const l = document.getElementById("nList"); if (l && draft) l.innerHTML = draft.files.map(fileTile).join(""); };

function openCallForm() {
  const nxt = meetingsAhead().find(m => mStart(m) > new Date());
  openModal("Call an early meeting", `
    <h2>Suggest an earlier time</h2>
    <p class="sub">Everyone gets a notification and votes. Once everyone says they're free, it ${nxt ? `replaces the ${fmtD(mStart(nxt))} meeting` : "goes on the calendar"}.</p>
    <div class="two"><label class="f">Day<input id="cDay" type="date" min="${localIso(new Date())}" value="${localIso(new Date(Date.now() + DAY))}"></label>
      <label class="f">Starts<input id="cTime" type="time" value="20:00"></label></div>
    <label class="f">Ends<input id="cEnd" type="time" value="21:00"></label>
    <label class="chk"><input id="cLand" type="checkbox">Include the landlord (she votes too)</label>
    <label class="f">Why (optional)<input id="cNote" placeholder="e.g. Need to sort the kitchen schedule"></label>
    <button class="btn brass wide" data-action="send-call">${ic("bell")}Notify everyone</button>`);
}

function openSetMeet(id) {
  const m = id ? meetingById(id) : null;
  const [d, t] = m ? toInputs(mStart(m)) : [localIso(new Date(Date.now() + 14 * DAY)), "17:00"];
  const e = m && m.ends_at ? toInputs(new Date(m.ends_at))[1] : (m ? "" : "19:00");
  openModal(m ? "Change meeting" : "Set next meeting", `
    <h2>${m ? "Change this meeting" : "Schedule a group meeting"}</h2>
    <div class="two"><label class="f">Day<input id="sDay" type="date" value="${d}"></label>
      <label class="f">Starts<input id="sTime" type="time" value="${t}"></label></div>
    <label class="f">Ends<input id="sEnd" type="time" value="${e}"></label>
    <label class="f">Where<input id="sPlace" value="${esc(m ? m.place || "" : "Living room")}"></label>
    <label class="f">Agenda<input id="sAgenda" value="${esc(m ? m.agenda || "" : "")}" placeholder="What will this one cover?"></label>
    <label class="chk"><input id="sLand" type="checkbox" ${m && m.landlord ? "checked" : ""}>Include the landlord</label>
    <p class="sub" style="font-size:13px">It shows on the calendar straight away, and everyone gets a reminder an hour before.</p>
    <button class="btn solid wide" data-action="save-meet" data-id="${m ? m.id : ""}">${m ? "Save changes" : "Add to calendar"}</button>`);
}

function openNotices() {
  const list = S.notices.map(n => { const d = new Date(n.created_at);
    return `<div><b>${esc(n.title)}</b><span class="sub" style="margin:0">${esc(n.body || "")}</span><br><span class="sub" style="margin:0;font-size:12px">${dayWord(d)}, ${fmtT(d)}</span></div>`; }).join("");
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  openModal("Notifications", `
    ${perm === "default" ? `<button class="btn solid wide" data-action="allow-notifs">${ic("bell")}Allow alerts on this device</button>` : ""}
    ${perm === "denied" ? `<div class="notice">${ic("bell")}<span>Alerts are blocked for this site in your browser settings.</span></div>` : ""}
    ${/iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone ? `<div class="notice">${ic("bell")}<span>On iPhone, alerts only work after you add the board to your Home Screen: Share → Add to Home Screen.</span></div>` : ""}
    <div class="nlist">${list || `<p class="sub">Nothing yet.</p>`}</div>`);
  local.set("hb:seen", Date.now()); drawBell();
}

// ===========================================================================
// Group meetings: actions
// ===========================================================================
async function act(fn, args, ok) {
  lastWrite = Date.now();
  try { const r = await rpc(fn, Object.assign({ p_code: CODE }, args)); await loadMeetings(); render(); if (ok) toast(ok); return r ?? true; }
  catch (e) { toast(e.message); await loadMeetings(); render(); return false; }
}
Object.assign(actions, {
  close: () => closeModal(),
  "open-sug": (el, id) => openSug(id),
  "show-past": () => { ui.showPast = !ui.showPast; render(); },
  kind: (el, id) => { if (!draft) return; draft.kind = id; document.querySelectorAll("#kinds button").forEach(b => b.setAttribute("aria-pressed", b === el)); },
  "ask-del-sug": (el, id) => { document.getElementById("delZone").innerHTML = `<div class="confirmbar">Delete this for everyone? It can't be undone.
      <button class="btn tiny danger" data-action="del-sug" data-id="${id}">Delete</button><button class="btn tiny" data-action="close">Keep</button></div>`; },
  "del-sug": async (el, id) => { closeModal(); await act("delete_suggestion", { p_id:id }, "Suggestion deleted."); },
  "post-sug": async () => {
    const title = val("nTitle"); if (!title) { toast("Give it a title first."); return document.getElementById("nTitle").focus(); }
    const btn = document.getElementById("postSug"); btn.disabled = true; btn.textContent = draft.files.length ? "Uploading…" : "Posting…";
    const files = [];
    try {
      for (const f of draft.files) {
        const safe = f.name.replace(/[^\w.\-]+/g, "_").slice(-80);
        const path = `${(crypto.randomUUID ? crypto.randomUUID() : uid() + uid())}/${safe}`;
        const { error } = await SB.storage.from("meeting-files").upload(path, f.file, { contentType: f.type });
        if (error) throw new Error(`Couldn't upload ${f.name}: ${error.message}`);
        files.push({ path, name: f.name, type: f.type });
      }
    } catch (e) { btn.disabled = false; btn.textContent = "Post suggestion"; return toast(e.message); }
    const ok = await act("add_suggestion", { p_kind: draft.kind, p_title: title, p_body: val("nBody"), p_files: files, p_meeting: val("nMeet") || null }, "Posted to the meeting list.");
    if (ok) closeModal(); else { btn.disabled = false; btn.textContent = "Post suggestion"; }
  },
  call: () => { if (openCall_()) return; openCallForm(); },
  "send-call": async () => {
    const st = fromInputs(val("cDay"), val("cTime")); if (!st) return toast("Pick a day and a start time.");
    const en = val("cEnd") ? fromInputs(val("cDay"), val("cEnd")) : null;
    const ok = await act("call_meeting", { p_starts: st.toISOString(), p_ends: en ? en.toISOString() : null, p_note: val("cNote"), p_landlord: document.getElementById("cLand").checked }, "Everyone has been notified.");
    if (ok) closeModal();
  },
  vote: async (el, id) => { const c = openCall(); if (!c) return; const r = await act("vote_call", { p_call: c.id, p_vote: id }); if (r === "passed") toast("Everyone's free. The meeting has moved."); else if (r) toast(id === "yes" ? "Marked as free." : "Marked as can't make it."); },
  "cancel-call": async () => { const c = openCall(); if (c) await act("cancel_call", { p_call: c.id }, "Call withdrawn."); },
  "set-meet": () => openSetMeet(null),
  "edit-meet": (el, id) => openSetMeet(id),
  "save-meet": async (el) => {
    const st = fromInputs(val("sDay"), val("sTime")); if (!st) return toast("Pick a day and a start time.");
    const en = val("sEnd") ? fromInputs(val("sDay"), val("sEnd")) : null;
    const ok = await act("set_meeting", { p_id: el.dataset.id || null, p_starts: st.toISOString(), p_ends: en ? en.toISOString() : null,
      p_place: val("sPlace"), p_agenda: val("sAgenda"), p_landlord: document.getElementById("sLand").checked }, el.dataset.id ? "Meeting updated." : "Meeting added to the calendar.");
    if (ok) closeModal();
  },
  "toggle-ll": async (el, id) => { const m = meetingById(id); if (!m) return;
    await act("set_meeting", { p_id: m.id, p_starts: m.starts_at, p_ends: m.ends_at, p_place: m.place, p_agenda: m.agenda, p_landlord: !m.landlord }, m.landlord ? "Landlord removed from this meeting." : "Landlord invited."); },
  "ask-del-meet": (el, id) => { ui.confirmDel = id; render(); },
  "del-meet-no": () => { ui.confirmDel = null; render(); },
  "del-meet": async (el, id) => { ui.confirmDel = null; await act("delete_meeting", { p_id: id }, "Meeting deleted. Its suggestions moved to the next one."); },
  notifs: () => openNotices(),
  "allow-notifs": async () => { try { await Notification.requestPermission(); } catch (e) {} openNotices(); },
  bview: (el, id) => { ui.bookView = id; render(); },
  home: () => { renderWelcome(); setLift(false); },
  theme: () => { const d = isDark(); document.documentElement.dataset.theme = d ? "light" : "dark"; local.set("hb:theme", d ? "light" : "dark"); drawTheme(); }
});
function openCall_() { if (openCall()) { goTab("meet"); toast("There's already an early meeting call open. Vote on that one."); return true; } return false; }

// ===========================================================================
// Bookings (with history)
// ===========================================================================
const bookName = b => (person(b.person_id) || {}).name || b.person_name || "A former housemate";
const hourOver = (day, h) => { const t = isoOf(todayUTC()); return day < t || (day === t && h < new Date().getHours()); };

function renderBook() {
  const res = S.config.resources;
  const cur = res.find(r => r.id === ui.res) || res[0];
  if (cur) ui.res = cur.id;
  const tabs = res.map(r => `<button data-action="pick-res" data-id="${r.id}" aria-current="${r.id === ui.res}">${esc(r.name)}</button>`).join("");
  const view = `<div class="seg"><button aria-pressed="${ui.bookView !== "history"}" data-action="bview" data-id="schedule">Schedule</button><button aria-pressed="${ui.bookView === "history"}" data-action="bview" data-id="history">History</button></div>`;
  const today = isoOf(todayUTC());
  let body = "";
  if (cur && ui.bookView === "history") {
    const past = S.bookings.filter(b => b.resource_id === cur.id && hourOver(b.day, b.hour))
      .sort((a, b) => (b.day + String(b.hour).padStart(2, "0")).localeCompare(a.day + String(a.hour).padStart(2, "0")));
    const runs = [];
    past.forEach(b => { const r = runs[runs.length - 1], nm = bookName(b);
      if (r && r.day === b.day && r.name === nm && r.from === b.hour + 1) r.from = b.hour;
      else runs.push({ day:b.day, name:nm, pid:b.person_id, from:b.hour, to:b.hour + 1 }); });
    const days = [...new Set(runs.map(r => r.day))];
    body = `<div class="card hist">${days.map(d => `<div class="day"><h4>${fmtDay(parseISO(d))}</h4>
      ${runs.filter(r => r.day === d).map(r => `<div class="item">${person(r.pid) ? chip(r.pid, true) : `<b>${esc(r.name)}</b>`}
        <span style="flex:1" class="unitname">${person(r.pid) ? esc(unitOf(r.pid)) : ""}</span>
        <span class="tn sub" style="margin:0">${hourLabel(r.from)} – ${hourLabel(r.to % 24)}</span></div>`).join("")}</div>`).join("")
      || `<p class="sub" style="margin:0">No past bookings for ${esc(cur.name)} yet.</p>`}</div>
      <div class="notice" style="margin-top:12px">${ic("lock")}<span>Past bookings are kept as a record so the house can see who used what. Nobody can change or cancel them, including the manager.</span></div>`;
  } else if (cur) {
    const days = Array.from({ length: 21 }, (_, i) => addDays(todayUTC(), i - 7)).map(d => {
      const iso = isoOf(d), past = iso < today;
      const count = S.bookings.filter(b => b.resource_id === ui.res && b.day === iso).length;
      return `<button class="${past ? "past" : ""}" data-action="pick-day" data-id="${iso}" aria-current="${iso === ui.day}">
        ${iso === today ? "Today" : d.toLocaleDateString(undefined, { weekday:"short", timeZone:"UTC" })}<b>${d.getUTCDate()}</b>
        ${past ? (count ? count + " used" : "—") : count ? count + " booked" : "Free"}</button>`;
    }).join("");
    const rows = [];
    for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
      const b = S.bookings.find(x => x.resource_id === cur.id && x.day === ui.day && x.hour === h), over = hourOver(ui.day, h);
      const who = b ? `${person(b.person_id) ? chip(b.person_id, true) : `<b>${esc(bookName(b))}</b>`}<span class="unitname">${esc(unitOf(b.person_id))}</span>` : "";
      if (over) rows.push(`<div class="slot locked"><span class="hr">${hourLabel(h)}</span><span class="who">${who || `<span class="sub" style="margin:0">Not used</span>`}</span><span class="lockt">${ic("lock")}Past</span></div>`);
      else if (!b) rows.push(`<div class="slot"><span class="hr">${hourLabel(h)}</span><span class="who"></span><button class="btn tiny" data-action="book" data-id="${h}">Book</button></div>`);
      else { const mine = b.person_id === ME;
        rows.push(`<div class="slot ${mine ? "mine" : ""}"><span class="hr">${hourLabel(h)}</span><span class="who">${who}</span>
          ${mine || IS_MANAGER ? `<button class="btn ghost tiny" data-action="unbook" data-id="${b.id}">Cancel</button>` : ""}</div>`); }
    }
    body = `<div class="days" id="days" data-noswipe>${days}</div>
      <p class="sub" style="margin:0 0 10px">${esc(cur.name)} · ${fmtDay(parseISO(ui.day))}${ui.day < today ? " · view only" : ""}</p>
      <div class="slots">${rows.join("")}</div>`;
  }
  return `
    <p class="eyebrow">Bookings</p>
    <h2 class="sec">Shared machines</h2>
    <p class="lede">Claim an hour on anything the house shares. Past days stay visible so everyone can see who used what.</p>
    <div class="row" style="justify-content:space-between;margin-bottom:14px"><div class="restabs" style="margin:0">${tabs}</div>${cur ? view : ""}</div>
    ${cur ? body : `<p class="empty">Nothing set up to book yet.</p>`}
    ${IS_MANAGER && cur && ui.bookView !== "history" ? `<div class="row" style="margin-top:12px">
      <button class="btn ghost tiny" data-action="del-res" data-id="${cur.id}">Remove ${esc(cur.name)}</button></div>` : ""}
    ${IS_MANAGER ? `
      <h3 class="sub-h">Add something to book</h3>
      <div class="row">
        <label class="stack">Name<input id="rName" placeholder="Washing Machine" data-enter="add-res" style="width:220px"></label>
        <button class="btn solid" data-action="add-res">Add</button>
      </div>`
      : `<p class="locked">Book and cancel your own upcoming hours. Only ${esc(managerName())} can change this list.</p>`}`;
}

// ===========================================================================
// Shell: tabs, swipe, welcome sheet, theme, alerts
// ===========================================================================
const isMobile = () => innerWidth < 720;
let SHELL = false;
function buildShell() {
  document.getElementById("app").outerHTML = `
    <div class="board" id="app">
      <div class="appbar">
        <div class="mark">HB</div>
        <div class="brand"><b>House Board</b><span id="who"></span></div>
        <button class="iconbtn" data-action="home" aria-label="Welcome screen" title="Welcome screen">${ic("home")}</button>
        <button class="iconbtn" data-action="notifs" aria-label="Notifications" title="Notifications" id="bell">${ic("bell")}</button>
        <button class="iconbtn" data-action="theme" aria-label="Light or dark mode" title="Light / dark" id="themeBtn"></button>
        <button class="iconbtn" data-action="refresh" aria-label="Refresh" title="Refresh" style="display:none"></button>
      </div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
      <div class="fabs off" id="fabs">
        <button class="fab second" data-action="call" aria-label="Call an early meeting" title="Call an early meeting">${ic("cal")}</button>
        <button class="fab" data-action="new-sug" aria-label="New suggestion" title="New suggestion">${ic("plus")}</button>
      </div>
    </div>
    <div class="sheet" id="sheet">
      <div class="wtop"><div class="mark">HB</div><span>${esc(HOUSE_NAME)}</span></div>
      <div class="wbody"><div><div class="hello" id="hello"></div><h1 id="welcome"></h1><div class="date" id="wdate"></div></div><div class="wtiles" id="wtiles"></div></div>
      <button class="grab" id="grab" aria-label="Open the board"><span class="handle"></span><span>${ic("up")}Drag up to open the board</span></button>
    </div>
    <div class="scrim" id="scrim" data-action="close"></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    <div class="notif" id="notif" data-action="notifs"><div class="mark">HB</div><div style="flex:1;min-width:0"><b id="notifTitle"></b><p id="notifText"></p></div></div>`;
  SHELL = true;
  wireSheet(); wireSwipe(); drawTheme();
  new ResizeObserver(() => { moveInk(); place(); }).observe(document.getElementById("viewport"));
  if (document.fonts) document.fonts.ready.then(moveInk);
}
actions["new-sug"] = () => openNew();

function render() {
  if (!SHELL) buildShell();
  const waiting = IS_MANAGER && MEMBERS ? MEMBERS.filter(m => m.status === "pending").length : 0;
  const nSug = (() => { const n = meetingsAhead()[0]; return n ? S.sugs.filter(s => s.meeting_id === n.id).length : 0; })();
  document.getElementById("who").innerHTML = SHARED ? `${esc(nameOf(ME))} · ${ROLE === "manager" ? "manager" : ROLE === "landlord" ? "landlord" : ROLE === "guest" ? "guest" : esc(unitOf(ME))}` : "This device only";
  document.getElementById("tabs").innerHTML = TABS.map(([id, label]) =>
    `<button data-action="tab" data-id="${id}" role="tab" aria-current="${ui.tab === id}"><span class="lbl">${label}${
      id === "house" && waiting ? `<span class="count">${waiting}</span>` : ""}${id === "meet" && nSug ? `<span class="count">${nSug}</span>` : ""}</span></button>`).join("") + `<span class="ink" id="ink"></span>`;
  const scrolls = {}; document.querySelectorAll(".panel").forEach(p => scrolls[p.dataset.tab] = p.scrollTop);
  const daysScroll = document.getElementById("days") ? document.getElementById("days").scrollLeft : null;
  document.getElementById("track").innerHTML = TABS.map(([id]) => `<section class="panel" data-tab="${id}" role="tabpanel"><div class="wrap">${RENDER[id]()}</div></section>`).join("");
  document.querySelectorAll(".panel").forEach(p => p.scrollTop = scrolls[p.dataset.tab] || 0);
  const days = document.getElementById("days");
  if (days) { if (daysScroll != null && !ui.recenter) days.scrollLeft = daysScroll;
    else { const on = days.querySelector('[aria-current="true"]'); if (on) days.scrollLeft = on.offsetLeft - days.clientWidth / 2 + on.offsetWidth / 2; } ui.recenter = false; }
  place(); moveInk(); renderWelcome(); drawBell();

  if (ui.focus) {
    const el = document.getElementById(ui.focus);
    if (el) { el.focus({ preventScroll:true }); if (ui.caret != null && el.setSelectionRange) { try { el.setSelectionRange(ui.caret, ui.caret); } catch (e) {} } }
    ui.focus = null; ui.caret = null;
  }
}
function place() {
  const i = Math.max(0, TABS.findIndex(t => t[0] === ui.tab));
  const tr = document.getElementById("track"); if (tr) tr.style.transform = `translateX(${-i * 100}%)`;
  const f = document.getElementById("fabs"); if (f) f.classList.toggle("off", ui.tab !== "meet" || IS_GUEST || (SHARED && !MEET_READY));
}
function moveInk() {
  const t = document.getElementById("tabs"); if (!t) return;
  const b = t.querySelector(`[data-id="${ui.tab}"] .lbl`), ink = document.getElementById("ink"); if (!b || !ink) return;
  const l = b.getBoundingClientRect(), tr = t.getBoundingClientRect();
  ink.style.width = l.width + "px"; ink.style.transform = `translateX(${l.left - tr.left + t.scrollLeft}px)`;
  const btn = b.parentElement;
  if (btn.offsetLeft < t.scrollLeft || btn.offsetLeft + btn.offsetWidth > t.scrollLeft + t.clientWidth) t.scrollTo({ left: btn.offsetLeft - 40, behavior:"smooth" });
}
function goTab(id) { ui.tab = id; ui.replyTo = null; ui.editZone = null; render(); }

// --- swipe between tabs on phones ---
function wireSwipe() {
  const vp = document.getElementById("viewport"), track = document.getElementById("track");
  let sx = null, sy = 0, dx = 0, axis = null, swiped = false;
  vp.addEventListener("pointerdown", e => {
    if (!isMobile() || e.target.closest("[data-noswipe],input,textarea,select,.scroll,.calwrap")) return;
    sx = e.clientX; sy = e.clientY; dx = 0; axis = null; swiped = false;
  });
  vp.addEventListener("pointermove", e => {
    if (sx === null) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!axis && (Math.abs(mx) > 10 || Math.abs(my) > 10)) axis = Math.abs(mx) > Math.abs(my) * 1.2 ? "x" : "y";
    if (axis !== "x") return;
    dx = mx; swiped = true;
    const i = TABS.findIndex(t => t[0] === ui.tab), w = vp.clientWidth;
    const edge = (i === 0 && dx > 0) || (i === TABS.length - 1 && dx < 0) ? 0.3 : 1;
    track.classList.add("dragging"); track.style.transform = `translateX(${-i * w + dx * edge}px)`;
  });
  const end = () => {
    if (sx === null) return; sx = null; track.classList.remove("dragging");
    if (axis === "x") {
      const i = TABS.findIndex(t => t[0] === ui.tab), w = vp.clientWidth;
      let n = i; if (dx < -w * 0.2) n = Math.min(TABS.length - 1, i + 1); else if (dx > w * 0.2) n = Math.max(0, i - 1);
      if (n !== i) return goTab(TABS[n][0]);
    }
    place();
  };
  vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
  // touch fallback: when the browser takes over a horizontal pan, pointercancel fires; touch events keep tracking
  vp.addEventListener("touchmove", e => { if (axis === "x") e.preventDefault(); }, { passive:false });
  vp.addEventListener("click", e => { if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; } }, true);
}

// --- welcome sheet ---
function setLift(on) { const s = document.getElementById("sheet"); s.style.transform = ""; s.classList.toggle("lifted", on); setTimeout(moveInk, 60); }
function wireSheet() {
  const sheet = document.getElementById("sheet");
  let y0 = null, dy = 0, t0 = 0;
  sheet.addEventListener("pointerdown", e => {
    if (e.target.closest(".wt")) return;
    y0 = e.clientY; dy = 0; t0 = performance.now(); sheet.classList.add("dragging");
    try { sheet.setPointerCapture(e.pointerId); } catch (_) {}
  });
  sheet.addEventListener("pointermove", e => { if (y0 === null) return; dy = Math.min(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => {
    if (y0 === null) return; y0 = null; sheet.classList.remove("dragging");
    if (Math.abs(dy) < 6) { sheet.style.transform = ""; return; }
    const v = -dy / Math.max(1, performance.now() - t0);
    setLift(-dy > sheet.offsetHeight * 0.22 || v > 0.6);
  };
  sheet.addEventListener("pointerup", end); sheet.addEventListener("pointercancel", end);
  document.getElementById("grab").addEventListener("click", () => { if (Math.abs(dy) < 6) setLift(true); });
  document.getElementById("wtiles").addEventListener("click", e => { const t = e.target.closest("[data-go]"); if (t) { goTab(t.dataset.go); setLift(true); } });
}
function renderWelcome() {
  const h = new Date().getHours(), now = new Date();
  document.getElementById("hello").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  document.getElementById("welcome").innerHTML = `Welcome <em>${esc((nameOf(ME) || "").split(" ")[0])}</em>`;
  document.getElementById("wdate").textContent = `${WDL[now.getDay()]}, ${MONTH_NAMES[now.getMonth()]} ${now.getDate()}`;
  const next = meetingsAhead()[0];
  const n = cycleIndex(), a = assignFor(n), done = S.progress[n] || {};
  const myZone = S.config.zones.find(z => (a[z.id] || []).includes(ME));
  const today = isoOf(todayUTC());
  const mine = S.bookings.filter(b => b.person_id === ME && !hourOver(b.day, b.hour)).sort((x, y) => (x.day + String(x.hour).padStart(2,"0")).localeCompare(y.day + String(y.hour).padStart(2,"0")))[0];
  const res = mine && S.config.resources.find(r => r.id === mine.resource_id);
  const open = S.notes.filter(p => !p.resolved);
  const call = openCall();
  document.getElementById("wtiles").innerHTML = `
    <button class="wt hot" data-go="meet"><small>${call ? "Early meeting vote" : "Group meeting"}</small>
      <b>${call ? fmtD(new Date(call.starts_at)) + ", " + fmtT(new Date(call.starts_at)) : next ? `${sameDay(mStart(next), now) ? (mStart(next).getHours() >= 17 ? "Tonight" : "Today") : fmtD(mStart(next))}, ${fmtT(mStart(next))}` : "Not scheduled"}</b>
      <span>${call ? (voteOf(call, ME) ? "You've voted" : "Waiting on your vote") : next ? `${S.sugs.filter(s => s.meeting_id === next.id).length} on the agenda` : "Post a suggestion anytime"}</span></button>
    <button class="wt" data-go="clean"><small>Your cleaning</small><b>${myZone ? esc(myZone.name) : "Nothing this cycle"}</b>
      <span>${myZone ? (done[myZone.id] ? "Done for this cycle" : "Due by " + fmtShort(addDays(cycleStart(n + 1), -1))) : "Enjoy the break"}</span></button>
    <button class="wt" data-go="book"><small>Next booking</small><b>${res ? esc(res.name) : "None booked"}</b>
      <span>${mine ? `${mine.day === today ? "Today" : fmtDay(parseISO(mine.day))} · ${hourLabel(mine.hour)}` : "Tap to book a slot"}</span></button>
    <button class="wt" data-go="board"><small>Noticeboard</small><b>${open.length} open post${open.length === 1 ? "" : "s"}</b>
      <span>${open.length ? esc(open.sort((x, y) => y.ts - x.ts)[0].text.slice(0, 40)) : "All quiet"}</span></button>`;
}

// --- theme ---
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function drawTheme() {
  const b = document.getElementById("themeBtn"); if (b) b.innerHTML = ic(isDark() ? "sun" : "moon");
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = isDark() ? "#0f1613" : "#f5f6f2";
}

// --- alerts ---
function drawBell() {
  const b = document.getElementById("bell"); if (!b) return;
  const seen = local.get("hb:seen") || 0, fresh = S.notices.some(n => new Date(n.created_at).getTime() > seen);
  b.innerHTML = ic("bell") + (fresh ? `<span class="dot"></span>` : "");
}
let notifTimer;
function alertUser(title, body) {
  const n = document.getElementById("notif"); if (!n) return;
  document.getElementById("notifTitle").textContent = title; document.getElementById("notifText").textContent = body || "";
  n.classList.add("on"); clearTimeout(notifTimer); notifTimer = setTimeout(() => n.classList.remove("on"), 5000);
  if ("Notification" in window && Notification.permission === "granted" && document.visibilityState !== "visible") {
    navigator.serviceWorker?.getRegistration().then(r => r ? r.showNotification(title, { body, icon:"icon-192.png" }) : new Notification(title, { body })).catch(() => {});
  }
}
// 1-hour reminder while the board is open (phone push for this comes next)
function checkReminder() {
  const m = meetingsAhead().find(x => mStart(x) > new Date()); if (!m) return;
  const left = mStart(m) - new Date(), key = "hb:reminded:" + m.id + ":" + m.starts_at;
  if (left <= 3600000 && left > 0 && !local.get(key)) { local.set(key, 1); alertUser("Group meeting in under an hour", `${fmtT(mStart(m))}${m.place ? " · " + m.place : ""}`); }
}
setInterval(checkReminder, 60000);

// 3 minutes before your booking ends: a nudge to clear the machine.
// Back-to-back hours count as one booking, so it fires once, at the real end.
function checkBookingEnd() {
  if (!ME) return;
  const now = new Date(), today = isoOf(todayUTC());
  const mine = S.bookings.filter(b => b.person_id === ME && b.day === today);
  mine.forEach(b => {
    if (mine.some(x => x.resource_id === b.resource_id && x.hour === b.hour + 1)) return;   // not the last hour
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), b.hour + 1, 0, 0);
    const left = end - now, key = `hb:ending:${b.id}`;
    if (left > 0 && left <= 3 * 60000 && !local.get(key)) {
      local.set(key, 1);
      const res = (S.config.resources.find(r => r.id === b.resource_id) || {}).name || "Your booking";
      alertUser(`${res}: ${Math.max(1, Math.round(left / 60000))} min left`,
                `Your time ends at ${hourLabel((b.hour + 1) % 24)}. Please take your things out for the next person.`);
    }
  });
}
setInterval(checkBookingEnd, 20000);

// 11 AM on the last day of the cleaning cycle. If the board is opened later
// that day, it still shows once.
function checkCycleEnd() {
  if (!ME || !S.config.zones.length) return;
  const n = cycleIndex(), last = isoOf(addDays(cycleStart(n + 1), -1));
  if (isoOf(todayUTC()) !== last || new Date().getHours() < 11) return;
  const key = `hb:cycle-end:${S.config.anchor}:${S.config.cycleDays}:${n}`;
  if (local.get(key)) return;
  local.set(key, 1);
  const a = assignFor(n), done = S.progress[n] || {};
  const mine = S.config.zones.filter(z => (a[z.id] || []).includes(ME));
  const todo = mine.filter(z => !done[z.id]);
  alertUser("Cleaning rotation ends today",
    todo.length ? `${todo.map(z => z.name).join(" and ")} ${todo.length > 1 ? "aren't" : "isn't"} marked cleaned yet. Tick ${todo.length > 1 ? "them" : "it"} off once done.`
    : mine.length ? `${mine.map(z => z.name).join(" and ")} ${mine.length > 1 ? "are" : "is"} done. Thanks! New areas start tomorrow.`
    : "New areas start tomorrow. Check the Cleaning tab to see yours.");
}
setInterval(checkCycleEnd, 60000);

// ===========================================================================
// Start — the login page owns sign-in; this page just checks and redirects
// ===========================================================================
(async function start() {
  if (!SHARED) { await loadAll(); return render(); }

  const saved = local.get("hb:code");
  if (!saved) return location.replace("login.html");

  try {
    const rows = await rpc("sign_in", { p_code: saved });
    const who = rows && rows[0];
    if (!who || who.status !== "active") { local.del("hb:code"); return location.replace("login.html"); }
    CODE = saved; ME = who.id;
    ROLE = who.role || (who.is_manager ? "manager" : "member");
    IS_MANAGER = ROLE === "manager";
    IS_GUEST   = ROLE === "guest";
  } catch (e) {
    document.getElementById("app").innerHTML =
      `<p class="loading">Can't reach the board. Check your connection and reload.</p>`;
    return;
  }

  await loadAll();
  await loadMembers();
  render();
  subscribe();
  checkReminder(); checkBookingEnd(); checkCycleEnd();
})();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
